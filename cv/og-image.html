<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: 'Helvetica Neue', -apple-system, Arial, sans-serif;
        background: #050505;
        color: #f5f0eb;
        overflow: hidden;
        position: relative;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 72px 72px;
      }
      .glow {
        position: absolute; top: -180px; right: -120px;
        width: 720px; height: 720px; border-radius: 50%;
        background: radial-gradient(circle, rgba(232,168,56,0.22), transparent 65%);
        filter: blur(20px);
      }
      .card {
        position: relative; z-index: 2;
        width: 100%; height: 100%;
        padding: 76px 80px;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .kicker {
        font-family: 'SF Mono', ui-monospace, monospace;
        font-size: 22px; letter-spacing: 6px; text-transform: uppercase;
        color: #8a8a8a;
      }
      h1 {
        font-size: 188px; font-weight: 800; letter-spacing: -6px; line-height: 0.9;
        color: #f5f0eb;
      }
      h1 .dot { color: #e8a838; }
      .headline {
        margin-top: 26px; font-size: 38px; font-weight: 700; letter-spacing: -0.5px;
        color: #f5f0eb; max-width: 920px; line-height: 1.18;
      }
      .bottom { display: flex; align-items: flex-end; justify-content: space-between; }
      .stats { display: flex; gap: 44px; }
      .stats span {
        font-family: 'SF Mono', ui-monospace, monospace;
        font-size: 24px; color: #8a8a8a; letter-spacing: 0.5px;
      }
      .stats b { color: #f5f0eb; font-weight: 700; }
      .accent { color: #e8a838 !important; }
      .url {
        font-family: 'SF Mono', ui-monospace, monospace;
        font-size: 24px; color: #e8a838; letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="card">
      <span class="kicker">// Brand &amp; Content Leader</span>
      <div>
        <h1>SWAROOP<span class="dot">.</span></h1>
        <p class="headline">Engineer by degree. Creator by grit. Growth marketer by design.</p>
      </div>
      <div class="bottom">
        <div class="stats">
          <span><b class="accent">1M+</b> organic audience</span>
          <span><b class="accent">18</b> channels &amp; systems</span>
          <span><b class="accent">460K</b> YouTube</span>
        </div>
        <span class="url">bjswaroop.github.io</span>
      </div>
    </div>
  </body>
</html>
